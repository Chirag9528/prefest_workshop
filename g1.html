<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Manipulation Examples</title>
  <link rel="stylesheet" href="g1.css">
</head>
<body>
  <h2>✨ DOM Manipulation Demo</h2>

  <!-- Example 1: Change Text -->
  <p id="text">Hello, World!</p>
  <button onclick="changeText()">Change Text</button>

  <!-- Example 2: Change Color -->
  <div id="colorBox"></div>
  <button onclick="changeColor()">Change Color</button>

  <!-- Example 3: Add/Remove Items -->
  <ul id="list">
    <li>Apple</li>
    <li>Banana</li>
  </ul>
  <input type="text" id="itemInput" placeholder="Enter item" />
  <button onclick="addItem()">Add Item</button>
  <button onclick="removeItem()">Remove Last Item</button>

  <!-- Example 4: Show/Hide -->
  <p id="hiddenText" style="display:none;">🎉 Surprise! You found me!</p>
  <button onclick="toggleText()">Show/Hide Text</button>
  <script src="g1.js"></script>
</body>
</html>
